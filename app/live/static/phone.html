<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1222">
<meta name="referrer" content="no-referrer">
<title>Philibert</title>
<!-- Philibert on the phone (nd_modelshare relay, /<key>/phone/): a chat box and simple pictures,
     answered by Philibert on the person's computer over Tailscale. One file, no libraries: the
     computer may be offline. Inside the Philibert Android app (window.PhilibertApp) the header
     also has Talk (spoken brainstorming) and Setup. -->
<style>
  :root { --bg:#0a1222; --panel:#13203a; --panel2:#182844; --line:rgba(120,160,220,.18); --text:#e6eefb;
          --dim:#8ea3c4; --cyan:#00d8f0; --user:#0e5d78; --red:#ff6b7a; --amber:#ffc35a;
          --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 var(--font); display:flex; flex-direction:column;
         height:100dvh; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
           border-bottom:1px solid var(--line); background:rgba(10,18,34,.95); }
  header .dot { display:inline-block; vertical-align:middle; margin-left:4px; width:8px; height:8px; border-radius:50%;
                background:var(--dim); flex:none; transition:background .3s; }
  header .dot.on { background:#3ddc97; box-shadow:0 0 8px #3ddc97; }
  header .dot.off { background:var(--red); }
  header h1 { font-size:18px; margin:0; font-weight:700; line-height:1.1; }
  header .brand { display:flex; align-items:center; gap:10px; }
  header .mark { width:30px; height:30px; flex:none; filter:drop-shadow(0 0 6px rgba(0,229,255,.45)); }
  header .eyebrow { color:var(--cyan); font-size:10px; font-weight:800; letter-spacing:.18em; line-height:1.2; }
  header .icon { width:38px; height:38px; padding:0; display:grid; place-items:center; border-radius:10px; }
  header .icon svg { width:20px; height:20px; }
  header .icon[hidden] { display:none; }
  header .grow { flex:1; min-width:0; }
  header button { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 11px;
                  font:inherit; font-size:13px; }
  .modelrow { display:flex; align-items:center; gap:8px; padding:6px 16px; border-bottom:1px solid var(--line);
              background:rgba(10,18,34,.95); font-size:13px; color:var(--dim); }
  .modelrow { flex-wrap:wrap; }
  .modelrow select { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line);
                     border-radius:8px; padding:6px 8px; font:inherit; font-size:14px; }
  .modelrow .fit { flex-basis:100%; font-size:12px; padding-left:48px; }
  .modelrow .fit:empty { display:none; }
  .fit.green { color:#3ddc97; } .fit.yellow { color:var(--amber); } .fit.red { color:var(--red); }
  #banner { display:none; background:#3a1d26; color:#ffd6dc; font-size:13px; padding:8px 16px; }
  #log { flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:10px;
         overscroll-behavior:contain; }
  .empty { margin:auto; text-align:center; color:var(--dim); font-size:14px; max-width:280px; }
  .empty b { color:var(--text); display:block; font-size:18px; margin-bottom:6px; }
  .msg { max-width:86%; padding:9px 13px; border-radius:16px; word-wrap:break-word; overflow-wrap:anywhere;
         animation:pop .18s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:5px; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.err { align-self:flex-start; background:#2a1620; border:1px solid rgba(255,107,122,.35); color:#ffd6dc; font-size:14px; }
  .msg.err button { margin-top:6px; }
  .msg p { margin:0 0 8px; } .msg p:last-child { margin-bottom:0; }
  .msg ul, .msg ol { margin:4px 0 8px; padding-left:20px; }
  .msg code { background:rgba(0,0,0,.35); padding:1px 5px; border-radius:4px; font-size:14px; }
  .msg pre { background:rgba(0,0,0,.35); padding:8px 10px; border-radius:8px; overflow-x:auto; font-size:13px; margin:6px 0; }
  .msg pre code { background:none; padding:0; }
  .msg h3 { font-size:16px; margin:8px 0 4px; }
  .msg a { color:var(--cyan); }
  .typing { display:inline-flex; gap:4px; padding:4px 0; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--cyan); opacity:.4; animation:bounce 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-5px); opacity:1; } }
  .stage { color:var(--dim); font-size:12px; margin-top:4px; display:flex; align-items:center; gap:6px; }
  .stage::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--cyan); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .pic { padding:6px; }
  .pic img { display:block; width:100%; max-width:320px; border-radius:11px; }
  .pic .cap { color:var(--dim); font-size:12px; padding:6px 4px 2px; }
  .drawing { width:260px; max-width:70vw; aspect-ratio:1; border-radius:11px; position:relative; overflow:hidden;
             background:linear-gradient(110deg, var(--panel2) 30%, #213761 50%, var(--panel2) 70%);
             background-size:250% 100%; animation:shimmer 1.6s linear infinite; display:flex; align-items:center;
             justify-content:center; color:var(--dim); font-size:13px; text-align:center; padding:16px; }
  @keyframes shimmer { from { background-position:150% 0; } to { background-position:-100% 0; } }
  footer { border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:rgba(10,18,34,.97); }
  .modes { display:flex; gap:6px; margin:0 2px 7px; }
  .modes button { flex:none; background:none; border:1px solid var(--line); color:var(--dim); border-radius:20px;
                  padding:5px 12px; font:inherit; font-size:13px; }
  .modes button.on { color:var(--bg); background:var(--cyan); border-color:var(--cyan); font-weight:600; }
  .bar { display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:20px;
             padding:10px 15px; font:inherit; font-size:16px; max-height:140px; outline:none; }
  textarea:focus { border-color:rgba(0,216,240,.55); }
  #send { width:44px; height:44px; flex:none; border-radius:50%; border:0; background:var(--cyan); color:var(--bg);
          font-size:20px; display:flex; align-items:center; justify-content:center; transition:transform .1s; }
  #send:active { transform:scale(.92); }
  #send:disabled { opacity:.35; }
  #send.stop { background:var(--red); color:#fff; font-size:16px; }
</style>
</head>
<body>
<header>
  <div class="grow brand">
    <svg class="mark" viewBox="20 28 160 148" aria-hidden="true">
      <path d="M62 62 V46 Q62 34 74 34 H126 Q138 34 138 46 V62" fill="none" stroke="#00e5ff" stroke-width="10" stroke-linecap="round"/>
      <rect x="26" y="60" width="148" height="100" rx="16" fill="#00e5ff"/>
      <circle cx="70" cy="104" r="25" fill="#0a1222"/><circle cx="70" cy="104" r="17" fill="#00e5ff"/><circle cx="70" cy="104" r="6" fill="#0a1222"/>
      <circle cx="130" cy="104" r="25" fill="#0a1222"/><circle cx="130" cy="104" r="17" fill="#00e5ff"/><circle cx="130" cy="104" r="6" fill="#0a1222"/>
      <path d="M48 143 H86 L93 134 L100 150 L107 138 L112 143 H152" fill="none" stroke="#0a1222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M100 150 L107 138 L112 143" fill="none" stroke="#ff2e88" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="44" y="160" width="20" height="10" rx="3" fill="#00e5ff"/><rect x="136" y="160" width="20" height="10" rx="3" fill="#00e5ff"/>
    </svg>
    <div><div class="eyebrow">ESTEEF AI</div><h1>Philibert <span class="dot" id="dot" title="Connecting…"></span></h1></div>
  </div>
  <button id="talk" class="icon" type="button" aria-label="Talk" title="Talk - a spoken conversation" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button>
  <button id="new" class="icon" type="button" aria-label="New chat" title="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <button id="setup" class="icon" type="button" aria-label="Setup" title="Setup" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
</header>
<div class="modelrow" id="modelrow" hidden><label for="model">Model</label><select id="model"></select><span class="fit" id="fit"></span></div>
<div id="banner">Can't reach your computer. Check that Tailscale is on here and Philibert is running there.</div>
<div id="log"></div>
<footer>
  <div class="modes">
    <button type="button" id="m-chat" class="on">Chat</button>
    <button type="button" id="m-pic">Picture</button>
  </div>
  <div class="bar">
    <textarea id="box" rows="1" placeholder="Message Philibert"></textarea>
    <button id="send" type="button" aria-label="Send">&#10148;</button>
  </div>
</footer>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), box = $("box"), send = $("send");
  var KEY = "philibert-phone-chat";
  var items = [];          // {role:"user"|"assistant", content} and {role:"picture", name, prompt} / {role:"picture-error"}
  var mode = "chat", busy = null;     // busy: {kind, job, el, stop}

  try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items.slice(-60))); } catch (e) {} }

  function api(op, body) {
    return fetch("api/" + op, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body || {}) })
      .then(function (r) { if (!r.ok && r.status !== 200) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function online(ok) {
    $("dot").className = "dot " + (ok ? "on" : "off");
    $("banner").style.display = ok ? "none" : "block";
  }

  /* a little Markdown: escape everything, then bold, italics, code, lists, headings, links */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inline(s) {
    return s.replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function md(text) {
    var out = [], list = null, lines = esc(text || "").split("\n"), code = null;
    function close() { if (list) { out.push("</" + list + ">"); list = null; } }
    lines.forEach(function (ln) {
      if (/^```/.test(ln)) { if (code === null) { close(); code = []; } else { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; } return; }
      if (code !== null) { code.push(ln); return; }
      var m;
      if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
      if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
      close();
      if ((m = ln.match(/^#{1,4}\s+(.*)/))) { out.push("<h3>" + inline(m[1]) + "</h3>"); return; }
      if (ln.trim()) out.push("<p>" + inline(ln) + "</p>");
    });
    if (code !== null) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
    close();
    return out.join("");
  }

  function bottom() { log.scrollTop = log.scrollHeight; }
  function bubble(cls, html) {
    var e = log.querySelector(".empty"); if (e) e.remove();
    var d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); bottom(); return d;
  }
  function picHtml(it) {
    return '<a href="img/' + encodeURIComponent(it.name) + '" target="_blank" rel="noopener"><img alt="" src="img/' +
      encodeURIComponent(it.name) + '"></a><div class="cap">' + esc(it.prompt) + "</div>";
  }
  function draw() {
    log.innerHTML = "";
    if (!items.length) {
      log.innerHTML = '<div class="empty"><b>Hi, I\'m Philibert.</b>Ask me anything - I can look in your notes, ' +
        'Yo Teach and Band Manager. Tap <i>Picture</i> to have me draw something.</div>';
      return;
    }
    items.forEach(function (it) {
      if (it.role === "user") bubble("user", esc(it.content));
      else if (it.role === "assistant") bubble("bot", md(it.content));
      else if (it.role === "picture") bubble("bot pic", picHtml(it)).querySelector("img").addEventListener("load", bottom);
      else if (it.role === "picture-ask") bubble("user", "🖼 " + esc(it.content));
    });
  }

  function setBusy(b) {
    busy = b;
    send.classList.toggle("stop", !!b);
    send.innerHTML = b ? "&#9632;" : "&#10148;";
    send.setAttribute("aria-label", b ? "Stop" : "Send");
    send.disabled = !b && !box.value.trim();
  }
  function fail(msg, retry) {
    var d = bubble("err", esc(msg) + (retry ? '<br><button type="button">Try again</button>' : ""));
    if (retry) d.querySelector("button").onclick = function () { d.remove(); retry(); };
  }

  var STAGES = { thinking: "Thinking", generating: "Writing", tool: "Looking it up", tools: "Looking it up",
                 searching: "Searching", reading: "Reading" };
  function stageText(st, detail) {
    var t = (detail || "").replace(/[.…]+$/, "");
    if (!t || /^queued$/i.test(t)) t = STAGES[st] || "Thinking";
    return t.length > 60 ? t.slice(0, 57) + "…" : t;
  }

  function chat(text) {
    items.push({ role: "user", content: text }); save();
    bubble("user", esc(text));
    var el = bubble("bot", '<span class="typing"><i></i><i></i><i></i></span><div class="stage">Thinking</div>');
    var msgs = items.filter(function (m) { return m.role === "user" || m.role === "assistant"; });
    var streamed = "", offset = 0, stopped = false;
    setBusy({ kind: "chat", el: el, stop: function () { stopped = true; if (busy && busy.job) api("cancel", { job: busy.job }); } });
    api("chat", { messages: msgs, model: $("model").value || "" }).then(function (r) {
      online(true);
      if (!r.ok) { el.remove(); setBusy(null); fail(r.msg || "That did not work."); return; }
      busy.job = r.job;
      (function poll() {
        api("poll", { job: r.job, from: offset }).then(function (p) {
          online(true);
          if (p.stream) {
            streamed = streamed.slice(0, Math.max(0, p.stream_at)) + p.stream;
            offset = p.stream_len;
          }
          if (p.status === "done" || p.status === "error" || !p.ok) {
            var reply = p.status === "done" ? (p.reply || streamed || "(no answer)") : null;
            if (reply !== null) {
              el.innerHTML = md(reply); items.push({ role: "assistant", content: reply }); save();
            } else {
              el.remove();
              if (!stopped) fail(p.error || p.msg || "Something went wrong on the computer.", function () { items.pop(); save(); chat(text); });
            }
            setBusy(null); bottom(); return;
          }
          var stage = '<div class="stage">' + esc(stageText(p.stage, p.detail)) + "</div>";
          el.innerHTML = (streamed.trim() ? md(streamed) : '<span class="typing"><i></i><i></i><i></i></span>') + stage;
          bottom();
          setTimeout(poll, streamed ? 450 : 800);
        }).catch(function () { online(false); setTimeout(poll, 2500); });
      })();
    }).catch(function () {
      online(false); el.remove(); setBusy(null);
      fail("Can't reach your computer right now.", function () { items.pop(); save(); chat(text); });
    });
  }

  function picture(prompt) {
    items.push({ role: "picture-ask", content: prompt }); save();
    bubble("user", "🖼 " + esc(prompt));
    var t0 = Date.now();
    var el = bubble("bot pic", '<div class="drawing">Drawing…<br>the first picture can take a few minutes</div>');
    var tick = setInterval(function () {
      var s = Math.round((Date.now() - t0) / 1000), d = el.querySelector(".drawing");
      if (d) d.innerHTML = "Drawing… " + s + "s" + (s < 20 ? "<br>the first picture can take a few minutes" : "");
    }, 1000);
    function end() { clearInterval(tick); setBusy(null); }
    setBusy({ kind: "picture", el: el, stop: function () { end(); el.remove(); } });
    api("picture", { prompt: prompt }).then(function (r) {
      online(true);
      if (!r.ok) { end(); el.remove(); fail(r.msg || "That did not work."); return; }
      (function poll() {
        if (!busy || busy.el !== el) return;            // stopped
        api("picture_poll", { job: r.job }).then(function (p) {
          online(true);
          if (p.status === "done") {
            end(); var it = { role: "picture", name: p.name, prompt: prompt };
            items.push(it); save(); el.innerHTML = picHtml(it);
            el.querySelector("img").addEventListener("load", bottom); return;
          }
          if (p.status === "error" || p.status === "unknown") {
            end(); el.remove(); fail(p.error || "The picture did not come back.", function () { items.pop(); save(); picture(prompt); }); return;
          }
          setTimeout(poll, 1500);
        }).catch(function () { online(false); setTimeout(poll, 3000); });
      })();
    }).catch(function () { end(); el.remove(); online(false); fail("Can't reach your computer right now."); });
  }

  function go() {
    if (busy) { busy.stop(); return; }
    var t = box.value.trim();
    if (!t) return;
    box.value = ""; grow();
    if (mode === "picture") picture(t); else chat(t);
  }
  function grow() {
    box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 140) + "px";
    box.style.overflowY = box.scrollHeight > 140 ? "auto" : "hidden";   // no scroll arrows on a one-line box
    if (!busy) send.disabled = !box.value.trim();
  }
  function setMode(m) {
    mode = m;
    $("m-chat").classList.toggle("on", m === "chat"); $("m-pic").classList.toggle("on", m === "picture");
    box.placeholder = m === "picture" ? "Describe a picture to draw" : "Message Philibert";
    box.focus();
  }

  send.onclick = go;
  box.addEventListener("input", grow);
  box.addEventListener("keydown", function (e) {      // a keyboard (tablet, desktop): Enter sends, Shift+Enter is a new line
    if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); go(); }
  });
  $("m-chat").onclick = function () { setMode("chat"); };
  $("m-pic").onclick = function () { setMode("picture"); };
  $("new").onclick = function () {
    if (busy) busy.stop();
    items = []; save(); draw();
  };

  /* the model picker: the computer's chat models, the choice remembered on this phone */
  var MKEY = "philibert-phone-model";
  function models() {
    api("models").then(function (r) {
      if (!r.ok || !r.models || !r.models.length) return;
      var want = "";
      try { want = localStorage.getItem(MKEY) || ""; } catch (e) {}
      if (!r.models.some(function (m) { return m.tag === want; })) want = r.default || r.models[0].tag;
      fits = {};
      $("model").innerHTML = r.models.map(function (m) {
        fits[m.tag] = m.fit;
        // a coloured dot in the option text: phones ignore styling inside a <select>
        return '<option value="' + esc(m.tag) + '"' + (m.tag === want ? " selected" : "") + ">" + (DOT[m.fit] || "") + " " +
          esc(m.label) + (m.tag === r.default ? " (default)" : "") + "</option>";
      }).join("");
      $("modelrow").hidden = false;
      showFit();
    }).catch(function () {});
  }
  /* green / yellow / red: how the model runs on the computer, the Models app's words */
  var DOT = { green: "🟢", yellow: "🟡", red: "🔴" };
  var FIT = { green: "runs well on your computer", yellow: "works on your computer, slowly", red: "too big for your computer - very slow" };
  var fits = {};
  function showFit() {
    var f = fits[$("model").value];
    $("fit").className = "fit " + (f || "");
    $("fit").textContent = f ? FIT[f] : "";
  }
  $("model").onchange = function () { try { localStorage.setItem(MKEY, this.value); } catch (e) {} showFit(); };

  draw(); setBusy(null); grow();
  api("hello").then(function (r) { online(true); $("dot").title = "Connected to " + (r.computer || "your computer"); models(); })
    .catch(function () { online(false); $("dot").title = "Not connected"; });
  // inside the Android app: Talk (the app's own spoken mode, with the model chosen here) and Setup
  if (window.PhilibertApp) {
    $("talk").hidden = false;
    $("setup").hidden = false;
    $("talk").onclick = function () { window.PhilibertApp.talk($("model").value || ""); };
    $("setup").onclick = function () { window.PhilibertApp.setup(); };
  }
})();
</script>
</body>
</html>
