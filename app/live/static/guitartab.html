<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philibert TabCrafter</title>
<link href="/live/fonts/fonts.css" rel="stylesheet">
<link rel="icon" href="/live/philibert-p1.svg">
<style>
  :root {
    --navy: #0f172a; --navy-deep: #0a1120; --panel: #111d36; --raise: #162544; --line: #1e3054;
    --cyan: #00f2fe; --amber: #f59e0b; --green: #10b981; --pink: #ff2e88;
    --txt: #d7e3f4; --dim: #8ea3c4; --faint: #6f86a8;
    --font: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--navy); color: var(--txt); font: 14px var(--font); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-rows: 54px 1fr 28px; height: 100%; }
  header { display: flex; align-items: center; gap: 14px; padding: 0 18px; background: linear-gradient(180deg, #101b33, #0d1729);
           border-bottom: 1px solid var(--line); position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
                  background: linear-gradient(90deg, transparent, rgba(0,242,254,.5), transparent); }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand svg { width: 28px; height: 28px; color: var(--cyan); filter: drop-shadow(0 0 6px rgba(0,242,254,.35)); }
  .brand b { font: 800 15px Montserrat, var(--font); letter-spacing: .12em; color: #fff; }
  .brand span { font: 10px var(--mono); letter-spacing: .2em; color: var(--cyan); }
  .spacer { flex: 1; }
  .btn { font: 11px var(--mono); letter-spacing: .1em; color: var(--dim); background: rgba(22,37,68,.5); border: 1px solid var(--line);
         border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s, background .15s, transform .12s; }
  .btn:hover:not(:disabled) { color: var(--cyan); border-color: rgba(0,242,254,.5); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible, .item:focus-visible, .f:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn.primary { color: #04131c; background: var(--cyan); border-color: var(--cyan); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { color: #04131c; background: #5ff7ff; }
  .btn.danger:hover:not(:disabled) { color: var(--pink); border-color: rgba(255,46,136,.5); }
  .btn.on { color: var(--cyan); border-color: rgba(0,242,254,.6); background: rgba(0,242,254,.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .main { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
  nav { border-right: 1px solid var(--line); background: var(--navy-deep); padding: 12px 8px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  nav .btn { margin: 0 4px 8px; }
  .item { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; background: none; border: 0; cursor: pointer; }
  .item:hover { background: rgba(0,242,254,.06); }
  .item.on { background: linear-gradient(90deg, rgba(0,242,254,.16), rgba(0,242,254,.03)); }
  .item b { display: block; font-weight: 500; color: #fff; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { display: block; font: 10.5px var(--mono); color: var(--faint); margin-top: 2px; }
  .item small.busy { color: var(--amber); }
  .navempty { color: var(--faint); font-size: 12.5px; padding: 8px 10px; line-height: 1.5; }
  section.view { overflow: auto; padding: 22px 26px 60px; min-height: 0; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 input { background: transparent; border: 1px solid transparent; border-radius: 6px; color: #fff; font: 600 22px var(--font); padding: 2px 6px; margin-left: -7px; min-width: 200px; max-width: 100%; }
  h1 input:hover { border-color: var(--line); }
  .lead { color: var(--dim); margin-bottom: 18px; font-size: 13.5px; max-width: 760px; line-height: 1.55; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font: 600 10.5px var(--font); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px;
             display: flex; align-items: center; gap: 8px; }
  .card h2 .right { margin-left: auto; display: flex; gap: 8px; text-transform: none; letter-spacing: 0; }
  /* the drop zone */
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 56px 24px; text-align: center; cursor: pointer;
          transition: border-color .15s, background .15s, transform .2s; background: rgba(17,29,54,.4); }
  .drop:hover, .drop.over { border-color: rgba(0,242,254,.6); background: rgba(0,242,254,.04); }
  .drop.over { transform: scale(1.01); }
  .drop svg { width: 56px; height: 56px; color: var(--cyan); margin-bottom: 12px; }
  .drop b { display: block; font-size: 17px; color: #fff; margin-bottom: 6px; }
  .drop span { color: var(--dim); font-size: 13px; }
  /* settings */
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; align-items: start; }
  .settings .check { padding: 26px 0 0; }
  label.f2 { display: flex; flex-direction: column; gap: 6px; font: 600 10px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  label.f2 > span.hint { font: 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--dim); }
  select, input[type=text], input[type=number] { background: rgba(8,15,30,.7); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
         outline: none; color-scheme: dark; font-size: 13.5px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--txt); width: 100%; }
  .bpm { display: flex; gap: 8px; }
  .bpm input { width: 90px; flex: none; font: 600 16px var(--mono); text-align: center; }
  .tap { flex: 1; font-weight: 600; }
  .tap.hit { animation: hit .18s ease-out; }
  @keyframes hit { from { transform: scale(.94); background: rgba(0,242,254,.25); } to { transform: none; } }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); cursor: pointer; padding-bottom: 8px; }
  .go { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .go .note { color: var(--dim); font-size: 12.5px; }
  .bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; flex: 1; min-width: 160px; max-width: 360px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), #7cf9ff); transition: width .3s ease-out; }
  .steps { display: flex; gap: 18px; font: 11.5px var(--mono); color: var(--faint); }
  .steps .now { color: var(--cyan); } .steps .done { color: var(--green); }
  /* the player */
  .player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: -22px; z-index: 5;
            background: var(--navy); padding: 10px 0; margin: -10px 0 6px; }
  .player .time { font: 12px var(--mono); color: var(--dim); min-width: 110px; }
  .player .speed { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--faint); }
  .player .speed input { width: 110px; accent-color: var(--cyan); }
  /* the tab */
  .tab { font: 14px/1.3 var(--mono); color: var(--faint); overflow-x: auto; padding-bottom: 8px; }
  .trow { display: flex; margin-bottom: 18px; }
  .names, .tbar, .col { display: flex; flex-direction: column; }
  .names span, .col span, .tbar span { height: 19px; white-space: pre; }
  .names { color: var(--dim); padding-right: 2px; }
  .names .num, .col .num, .tbar .num { color: var(--amber); font-size: 11px; height: 17px; }
  .names .rh, .col .rh, .tbar .rh { color: var(--faint); font-size: 11px; height: 17px; }
  .col { transition: background .12s; border-radius: 3px; }
  .col.now { background: rgba(0,242,254,.14); }
  .col.now .f { color: #fff; }
  .f { color: var(--txt); cursor: pointer; border-radius: 3px; background: none; border: 0; font: inherit; padding: 0; }
  .f:hover { background: rgba(0,242,254,.2); color: #fff; }
  .f.edited { color: var(--amber); }
  .f.sel { background: var(--cyan); color: #04131c; }
  .dash { cursor: cell; }
  .dash:hover { color: var(--cyan); }
  /* the note editor */
  .pop { position: fixed; z-index: 60; background: var(--raise); border: 1px solid rgba(0,242,254,.4); border-radius: 10px; padding: 12px;
         width: 260px; box-shadow: 0 16px 40px rgba(0,0,0,.45); transform-origin: top left; animation: pop .14s ease-out; }
  @keyframes pop { from { transform: scale(.92) translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pop h3 { font: 600 10px var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .pop .alts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pop .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pop .row input { width: 70px; }
  .pop .name { font: 12px var(--mono); color: var(--cyan); }
  /* the audio file splitter */
  .item.tool { border: 1px dashed var(--line); margin-bottom: 6px; }
  .item.tool b { color: var(--cyan); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 18px; }
  .facts small { display: block; font: 600 10px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
  .facts b { font-weight: 500; color: #fff; word-break: break-word; }
  .spfolder { font: 12px var(--mono); color: var(--dim); margin-bottom: 10px; word-break: break-all; }
  .parts { list-style: none; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .parts li { display: flex; gap: 12px; justify-content: space-between; padding: 7px 12px; font: 12.5px var(--mono); border-bottom: 1px solid rgba(30,48,84,.6); }
  .parts li:last-child { border-bottom: 0; }
  .parts li b { font-weight: 500; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .parts li span { color: var(--faint); white-space: nowrap; }
  .parts li em { color: var(--amber); font-style: normal; }
  .note { color: var(--dim); font-size: 12.5px; }
  .hint a { color: var(--cyan); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  /* setup */
  .setup ul { margin: 6px 0 14px 18px; color: var(--dim); line-height: 1.7; font-size: 13.5px; }
  .err { color: var(--pink); font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--raise), #1d3158, var(--raise)); background-size: 200% 100%;
          animation: sk 1.2s linear infinite; margin: 8px 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  footer { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid var(--line); background: var(--navy-deep);
           font: 11px var(--mono); color: var(--faint); }
  footer .ok { color: var(--green); }
  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(10px); z-index: 80; font: 12px var(--mono);
           background: var(--raise); border: 1px solid rgba(0,242,254,.4); color: var(--txt); padding: 9px 16px; border-radius: 8px;
           opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: 80vw; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  @media (max-width: 760px) {      /* narrow: the tabs become a strip along the top */
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .settings { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    nav .btn { display: none; }
    .item { width: auto; min-width: 150px; flex: none; }
    .navempty { white-space: nowrap; }
    .brand span, #keys { display: none; }
    section.view { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 10.5 19 5M17.5 3.5l3 3M12.5 9.5c-1.6-.8-3.4-.2-4.3 1.3-2 .1-4.2 1.9-4.2 4.4 0 2.6 2.1 4.8 4.8 4.8 2.5 0 4.3-2.2 4.4-4.2 1.5-.9 2.1-2.7 1.3-4.3z" fill="currentColor" fill-opacity=".2"/>
      <circle cx="9" cy="15" r="1"/></svg><b>PHILIBERT</b><span>TABCRAFTER</span></a>
    <div class="spacer"></div>
    <button class="btn" id="split" type="button" title="Cut a long audiobook into parts">✂ AUDIO SPLITTER</button>
    <button class="btn primary" id="new" type="button" disabled>+ NEW TAB</button>
  </header>
  <div class="main">
    <nav id="nav" aria-label="Your tabs"><div class="skel"></div><div class="skel"></div><div class="skel"></div></nav>
    <section class="view" id="view"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></section>
  </div>
  <footer><span id="status">Loading</span><span class="spacer"></span><span id="keys">Space: play / pause · T: tap tempo · Ctrl+Z: undo</span></footer>
</div>
<input type="file" id="file" accept=".wav,.mp3,.flac,.ogg,audio/*" hidden>
<audio id="audio" preload="auto"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/live/guitartab.js"></script>
</body>
</html>
