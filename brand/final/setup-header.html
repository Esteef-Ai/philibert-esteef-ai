<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url(../../../ND3/live/static/fonts/Montserrat.woff2) format('woff2'); }
  html, body { margin: 0; background: #0f172a; }
  .hdr { width: 560px; height: 112px; display: flex; align-items: center; gap: 18px; padding: 0 28px; box-sizing: border-box;
         background: radial-gradient(ellipse 70% 120% at 18% 50%, rgba(0,229,255,0.10), transparent 70%), #0f172a;
         border-bottom: 1px solid #1e3054; }
  .p1 { width: 64px; height: 64px; --mark: #00e5ff; --bg: #0f172a; filter: drop-shadow(0 0 10px rgba(0,229,255,0.35)); }
  .name { font-family: Montserrat; font-weight: 800; font-size: 30px; letter-spacing: .12em; color: #fff; line-height: 1; }
  .by { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-family: Montserrat; font-weight: 600;
        font-size: 10px; letter-spacing: .22em; color: #8ea3c4; }
  .by svg { height: 24px; width: auto; --ink: #d7e3f4; --orbit: #00e5ff; --ai: #00e5ff; --node: #ff2e88; }
  .by svg text { font-family: Montserrat; }
</style></head>
<body><div class="hdr">
  <svg class="p1" viewBox="0 0 200 200">
    <path d="M62 62 V46 Q62 34 74 34 H126 Q138 34 138 46 V62" fill="none" stroke="var(--mark)" stroke-width="9" stroke-linecap="round"/>
    <rect x="26" y="60" width="148" height="100" rx="16" fill="var(--mark)"/>
    <circle cx="70" cy="104" r="25" fill="var(--bg)"/><circle cx="70" cy="104" r="17" fill="var(--mark)"/><circle cx="70" cy="104" r="6" fill="var(--bg)"/>
    <circle cx="130" cy="104" r="25" fill="var(--bg)"/><circle cx="130" cy="104" r="17" fill="var(--mark)"/><circle cx="130" cy="104" r="6" fill="var(--bg)"/>
    <path d="M48 143 H86 L93 134 L100 150 L107 138 L112 143 H152" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="160" width="20" height="10" rx="3" fill="var(--mark)"/><rect x="136" y="160" width="20" height="10" rx="3" fill="var(--mark)"/>
  </svg>
  <div>
    <div class="name">PHILIBERT</div>
    <div class="by">BY
      <svg viewBox="50 0 230 80">
        <text x="128" y="52" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="4" fill="var(--ink)">ESTEEF</text>
        <ellipse cx="238" cy="40" rx="30" ry="14" fill="none" stroke="var(--orbit)" stroke-width="3" transform="rotate(-18 238 40)"/>
        <text x="238" y="52" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="3.6" fill="var(--ai)">AI</text>
        <circle cx="212" cy="53" r="4" fill="var(--node)"/>
      </svg>
    </div>
  </div>
</div></body></html>
