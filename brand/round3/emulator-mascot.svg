<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640">
  <!-- The EMUlator - Retro Vault's mascot: a wild emu, half torn away to a chrome
       cyborg skull with a red robot eye, a metal neck and a claw holding a pad.
       Cel-shaded: base colour, one hard shadow tone, one highlight, heavy ink line. -->
  <defs>
    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.9"/><stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#000" opacity="0.18"/></pattern>
  </defs>
  <g stroke="#14100d" stroke-linejoin="round" stroke-linecap="round">

    <!-- back of the neck: shaggy feathers -->
    <path d="M178 640 Q170 520 196 430 Q160 420 150 380 Q182 392 196 378 Q168 350 174 318 Q200 340 214 330
             L330 330 Q340 352 360 350 Q352 380 372 392 Q352 410 332 410 Q356 520 360 640 Z" fill="#4a4038" stroke-width="7"/>
    <path d="M200 450 Q196 540 206 640" fill="none" stroke="#2e2722" stroke-width="16"/>
    <!-- the metal half of the neck: vertebrae + hoses showing through torn feathers -->
    <path d="M286 400 Q300 470 302 640 L340 640 Q338 500 326 410 Z" fill="#2e2722" stroke-width="5"/>
    <g stroke-width="5">
      <rect x="292" y="430" width="34" height="22" rx="6" fill="#c9d1dc"/><rect x="294" y="462" width="34" height="22" rx="6" fill="#c9d1dc"/>
      <rect x="296" y="494" width="34" height="22" rx="6" fill="#c9d1dc"/><rect x="298" y="526" width="34" height="22" rx="6" fill="#c9d1dc"/>
      <rect x="300" y="558" width="34" height="22" rx="6" fill="#c9d1dc"/><rect x="302" y="590" width="34" height="22" rx="6" fill="#c9d1dc"/>
    </g>
    <g stroke="none" fill="#7d8794"><rect x="314" y="436" width="10" height="14"/><rect x="316" y="468" width="10" height="14"/><rect x="318" y="500" width="10" height="14"/><rect x="320" y="532" width="10" height="14"/><rect x="322" y="564" width="10" height="14"/></g>
    <path d="M286 420 Q270 520 282 640" fill="none" stroke-width="12"/><path d="M286 420 Q270 520 282 640" fill="none" stroke="#ff2e88" stroke-width="5"/>
    <path d="M340 420 Q356 520 346 640" fill="none" stroke-width="12"/><path d="M340 420 Q356 520 346 640" fill="none" stroke="#7d8794" stroke-width="5"/>
    <!-- torn feather edge over the metal -->
    <path d="M282 400 L292 424 L298 410 L306 432 L314 412 L322 436 L328 414 L334 430" fill="none" stroke-width="5"/>

    <!-- the head: wild crest -->
    <path d="M150 210 L116 150 L168 176 L150 96 L200 152 L206 70 L238 140 L262 62 L280 138 L320 74 L320 146 L370 104
             L356 170 L408 160 L376 210 Z" fill="#3b322b" stroke-width="7"/>
    <path d="M176 186 L160 140 M214 160 L214 108 M258 150 L262 100 M300 150 L316 110 M340 170 L366 140" fill="none" stroke="#6e6255" stroke-width="4"/>
    <!-- skull shape: organic left, torn open right -->
    <path d="M150 220 Q150 160 226 156 Q330 150 368 200 Q392 236 380 288 Q370 336 330 352 L220 358 Q160 350 148 300 Z" fill="#8a8f99" stroke-width="8"/>
    <path d="M160 300 Q176 344 226 350 L246 350" fill="none" stroke="#6b707a" stroke-width="14"/>
    <!-- chrome skull plate on the right, framed by torn skin -->
    <path d="M262 172 Q330 160 366 204 Q388 236 378 286 Q370 324 336 340 L284 344 Q300 300 290 262 Q306 236 284 214 Q298 196 262 172 Z" fill="#c9d1dc" stroke-width="7"/>
    <path d="M282 330 L334 330 Q362 318 368 284" fill="none" stroke="#7d8794" stroke-width="12"/>
    <path d="M300 190 Q336 186 358 214" fill="none" stroke="#ffffff" stroke-width="6"/>
    <g fill="#7d8794" stroke-width="3"><circle cx="352" cy="232" r="5"/><circle cx="360" cy="300" r="5"/><circle cx="312" cy="318" r="5"/></g>
    <path d="M262 172 L272 188 L262 196 L280 206 L272 220 L288 230 L282 246 L294 262 L288 286 L298 302 L290 322 L300 340" fill="none" stroke-width="5"/>

    <!-- the organic eye: huge, orange, bulging -->
    <circle cx="208" cy="236" r="40" fill="#f3e4c8" stroke-width="7"/>
    <circle cx="210" cy="238" r="30" fill="#e0601f" stroke-width="5"/>
    <circle cx="214" cy="240" r="13" fill="#14100d" stroke="none"/>
    <circle cx="219" cy="233" r="5" fill="#fff" stroke="none"/>
    <path d="M168 214 Q206 188 248 212" fill="none" stroke-width="7"/>
    <!-- the robot eye: red lens in a socket -->
    <circle cx="326" cy="242" r="44" fill="url(#redglow)" stroke="none"/>
    <circle cx="326" cy="242" r="27" fill="#3a3f48" stroke-width="7"/>
    <circle cx="326" cy="242" r="17" fill="#ff2a2a" stroke-width="4"/>
    <circle cx="326" cy="242" r="7" fill="#ffe0d8" stroke="none"/>
    <path d="M296 220 L312 228 M356 220 L340 228" stroke-width="5"/>

    <!-- the beak: big, flat, grumpy; half of it chrome -->
    <path d="M190 300 Q230 278 300 284 Q348 290 356 318 Q340 344 290 346 Q230 348 196 328 Z" fill="#5d6470" stroke-width="8"/>
    <path d="M274 284 Q336 288 356 318 Q340 344 290 346 L274 346 Z" fill="#c9d1dc" stroke-width="6"/>
    <path d="M196 322 Q260 312 352 320" fill="none" stroke-width="6"/>
    <path d="M206 300 Q240 290 270 290" fill="none" stroke="#8a919c" stroke-width="5"/>
    <ellipse cx="262" cy="302" rx="9" ry="6" fill="#14100d" stroke="none"/>
    <g stroke-width="3" fill="#eef2f6"><path d="M282 322 L288 332 L294 322"/><path d="M300 322 L306 332 L312 322"/><path d="M318 322 L324 332 L330 322"/></g>
    <path d="M196 326 L232 336 Q212 346 196 334" fill="#2e2722" stroke-width="4"/>

    <!-- robot claw holding a retro pad -->
    <path d="M70 640 Q92 560 132 520 L176 548 Q148 590 140 640 Z" fill="#c9d1dc" stroke-width="7"/>
    <path d="M132 520 L176 548" stroke="#7d8794" stroke-width="10"/>
    <rect x="96" y="470" width="150" height="74" rx="14" fill="#2b2f37" stroke-width="7" transform="rotate(-12 171 507)"/>
    <g transform="rotate(-12 171 507)" stroke-width="4">
      <path d="M118 500 H140 M129 489 V511" stroke="#c9d1dc" stroke-width="8"/>
      <circle cx="212" cy="498" r="8" fill="#ff2e88"/><circle cx="230" cy="512" r="8" fill="#00e5ff"/>
      <rect x="160" y="512" width="16" height="6" rx="3" fill="#7d8794"/><rect x="182" y="512" width="16" height="6" rx="3" fill="#7d8794"/>
    </g>
    <g fill="#c9d1dc" stroke-width="6">
      <path d="M118 548 Q104 520 112 492 L128 496 Q124 520 134 540 Z"/>
      <path d="M150 556 Q144 520 156 492 L172 498 Q164 524 168 548 Z"/>
      <path d="M90 560 Q78 540 84 516 L100 520 Q98 538 106 552 Z"/>
    </g>
  </g>
  <rect width="520" height="640" fill="url(#dots)" opacity="0.35"/>
</svg>
