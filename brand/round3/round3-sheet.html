<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Round 3 - Retro Vault, EMUlator, Philibert icon</title>
<style>
@font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url(../../../ND3/live/static/fonts/Montserrat.woff2) format('woff2'); }
body { margin: 0; background: #0f172a; color: #d7e3f4; font-family: Montserrat, system-ui, sans-serif; }
.wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 28px; max-width: 1400px; }
.card { background: #16213a; border: 1px solid #1e3054; border-radius: 18px; padding: 20px; }
h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8ea3c4; }
.lockup { display: flex; flex-direction: column; align-items: center; }
.lockup img { width: 380px; }
.word { font-weight: 900; font-size: 54px; letter-spacing: .06em; color: #f4e7c8; margin-top: -6px;
        text-shadow: 3px 3px 0 #1a120c, 6px 6px 0 #00e5ff55; -webkit-text-stroke: 2px #1a120c; }
.word span { color: #00e5ff; }
.sizes { display: flex; align-items: flex-end; gap: 22px; margin-top: 10px; }
.sizes figure { margin: 0; text-align: center; font-size: 11px; color: #8ea3c4; }
.mascot img { width: 100%; max-width: 440px; display: block; margin: 0 auto; }
.mascot .name { text-align: center; font-weight: 900; font-size: 40px; letter-spacing: .05em; color: #ff2a2a; -webkit-text-stroke: 2px #14100d; text-shadow: 3px 3px 0 #14100d; }
.mascot .name b { color: #f4e7c8; }
</style></head><body><div class="wrap">
  <div class="card lockup"><h2>Retro Vault - main logo</h2>
    <img src="retrovault-tv.svg"><div class="word">RETRO <span>VAULT</span></div></div>
  <div class="card mascot"><h2>The EMUlator - mascot</h2>
    <img src="emulator-mascot.svg"><div class="name">THE <b>EMU</b>LATOR</div></div>
  <div class="card"><h2>Retro Vault - app icon</h2>
    <div class="sizes">
      <figure><img src="retrovault-icon.svg" width="256"><figcaption>256</figcaption></figure>
      <figure><img src="retrovault-icon.svg" width="64"><figcaption>64</figcaption></figure>
      <figure><img src="retrovault-icon.svg" width="32"><figcaption>32</figcaption></figure>
      <figure><img src="retrovault-icon.svg" width="16"><figcaption>16</figcaption></figure></div></div>
  <div class="card"><h2>Philibert - desktop / Setup icon</h2>
    <div class="sizes">
      <figure><img src="philibert-icon.svg" width="256"><figcaption>256</figcaption></figure>
      <figure><img src="philibert-icon.svg" width="64"><figcaption>64</figcaption></figure>
      <figure><img src="philibert-icon.svg" width="32"><figcaption>32</figcaption></figure>
      <figure><img src="philibert-icon.svg" width="16"><figcaption>16</figcaption></figure></div></div>
</div></body></html>
